apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemoapp2-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kubedemoapp2
  template:
    metadata:
      labels:
        app: kubedemoapp2
    spec:
      containers:
        - name: kubedemoapp2
          image: induduvva/test_dev:register
          ports:
            - containerPort: 5000